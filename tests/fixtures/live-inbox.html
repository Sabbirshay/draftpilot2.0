<!doctype html><html><head><meta charset="utf-8"><title>Live inbox simulator</title><style>body{font:16px system-ui;color:#263d34;background:#f3f5f3;margin:0}header{padding:22px 35px;background:#173d34;color:white}main{margin:30px 440px 30px 35px;max-width:700px}article{padding:16px;background:white;border-radius:12px;margin:14px 0;max-width:80%}[data-sender=agent]{margin-left:auto;background:#dfebd8}textarea{width:95%;height:135px;padding:12px}button{padding:10px;margin:8px 8px 8px 0}small{display:block;margin:12px 0;color:#50675c}</style></head><body><header>DraftPilot · Live inbox simulator</header><main><small>Example chat layout. Not a real Crisp or Mevrik inbox. No messages are sent externally.</small><h1>Return request</h1><div role="log" aria-label="Conversation" data-conversation-id="chat-one"><article data-sender="customer" data-message-id="initial"><strong>Customer</strong><p>Can I return an unused item? How long is the return window?</p></article></div><div><button id="incoming">Add customer reply</button><button id="outgoing">Add agent reply</button><button id="switch">Switch conversation</button></div><label for="reply">Chat reply box</label><textarea id="reply"></textarea><button id="send">Send (simulation)</button></main><script>window.sent=0;let n=0;const log=document.querySelector('[role=log]');function add(sender,text){const a=document.createElement('article');a.dataset.sender=sender;a.dataset.messageId=String(++n);const p=document.createElement('p');p.textContent=text;a.append(p);log.append(a)}document.querySelector('#incoming').onclick=()=>add('customer','Where can I request the return label for this unused item?');document.querySelector('#outgoing').onclick=()=>add('agent','Agent-only reply: I am looking into this.');document.querySelector('#switch').onclick=()=>{log.dataset.conversationId='chat-'+Date.now();log.replaceChildren();add('customer','A different customer needs help with their account.');document.querySelector('#reply').value='';};document.querySelector('#send').onclick=()=>window.sent++;</script></body></html>
